name: MNG Airlock
on: [push,pull_request]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          echo scanning for leaked credentials
          ! grep -r "sk-" src/ && ! grep -r "eyJ" src/ || exit 1
      - name: Structural check
        run: npx tsc --noEmit
